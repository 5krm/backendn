<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs fill="#000000">
    <!-- Soft background glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fill="#000000">
      <stop offset="0%" stop-color="#F3F4F6" stop-opacity="1" fill="#000000"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" fill="#000000"/>
    </radialGradient>

    <!-- Main Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%" fill="#000000">
      <stop offset="0%" stop-color="#00cc99" fill="#000000"/>
      <stop offset="100%" stop-color="#04ad83" fill="#000000"/>
    </linearGradient>

    <!-- Secondary Gradient for Accent Elements -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%" fill="#000000">
      <stop offset="0%" stop-color="#18e3b0" fill="#000000"/>
      <stop offset="100%" stop-color="#adffeb" fill="#000000"/>
    </linearGradient>

    <!-- Shadow Effects -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%" fill="#000000">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.08" fill="#000000"/>
    </filter>
    
    <filter id="float-shadow" x="-20%" y="-20%" width="140%" height="140%" fill="#000000">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#04ad83" flood-opacity="0.15" fill="#000000"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <circle cx="200" cy="150" r="140" fill="url(#bg-glow)"/>

  <!-- Background Decorative Grid / Rays -->
  <g opacity="0.4" stroke="#d8fff5" stroke-width="1.5" stroke-dasharray="4 4">
    <circle cx="200" cy="150" r="110" fill="none"/>
    <circle cx="200" cy="150" r="75" fill="none"/>
  </g>

  <!-- Floating Sparkles & Particles -->
  <g opacity="0.7">
    <!-- Top Left Sparkle -->
    <path d="M 100 80 Q 100 90 90 90 Q 100 90 100 100 Q 100 90 110 90 Q 100 90 100 80 Z" fill="#18e3b0"/>
    <circle cx="120" cy="65" r="3" fill="#38e3b8"/>
    
    <!-- Top Right Sparkle -->
    <path d="M 300 70 Q 300 80 290 80 Q 300 80 300 90 Q 300 80 310 80 Q 300 80 300 70 Z" fill="#00cc99"/>
    <circle cx="280" cy="100" r="4" fill="#adffeb"/>

    <!-- Bottom Left Small Star -->
    <circle cx="95" cy="210" r="3" fill="#18e3b0"/>
    
    <!-- Bottom Right Sparkle -->
    <path d="M 310 190 Q 310 197 303 197 Q 310 197 310 204 Q 310 197 317 197 Q 310 197 310 190 Z" fill="#38e3b8"/>
  </g>

  <!-- Main Illustration Group -->
  <g filter="url(#drop-shadow)">
    
    <!-- Stacked Background Book 2 (Bottom) -->
    <path d="M 125 185 L 200 205 L 275 185 L 275 197 L 200 217 L 125 197 Z" fill="#CBD5E1"/>
    <path d="M 125 197 L 200 217 L 275 197 L 275 202 L 200 222 L 125 202 Z" fill="#94A3B8"/>

    <!-- Stacked Background Book 1 (Middle) -->
    <path d="M 130 168 L 200 186 L 270 168 L 270 179 L 200 197 L 130 179 Z" fill="#38e3b8"/>
    <path d="M 130 179 L 200 197 L 270 179 L 270 184 L 200 202 L 130 184 Z" fill="#00cc99"/>

    <!-- Main Open Course Book Base -->
    <!-- Left Page Base -->
    <path d="M 115 150 C 115 150, 155 142, 196 154 L 196 182 C 155 170, 115 178, 115 178 Z" fill="#E2E8F0"/>
    <!-- Right Page Base -->
    <path d="M 285 150 C 285 150, 245 142, 204 154 L 204 182 C 245 170, 285 178, 285 178 Z" fill="#CBD5E1"/>
    
    <!-- Top Open Pages -->
    <!-- Left Main Page -->
    <path d="M 118 144 C 118 144, 156 136, 197 148 L 197 175 C 156 163, 118 171, 118 171 Z" fill="#FFFFFF"/>
    <!-- Right Main Page -->
    <path d="M 282 144 C 282 144, 244 136, 203 148 L 203 175 C 244 163, 282 171, 282 171 Z" fill="#F8FAFC"/>
    
    <!-- Spine Center -->
    <path d="M 197 148 Q 200 149 203 148 L 203 175 Q 200 176 197 175 Z" fill="#E2E8F0"/>

    <!-- Placeholder Content Lines on Book Pages -->
    <!-- Left Page Lines -->
    <line x1="135" y1="152" x2="180" y2="147" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>
    <line x1="135" y1="160" x2="175" y2="155" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>
    <line x1="135" y1="168" x2="165" y2="163" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>

    <!-- Right Page Lines -->
    <line x1="220" y1="147" x2="265" y2="152" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>
    <line x1="225" y1="155" x2="265" y2="160" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>
    <line x1="235" y1="163" x2="265" y2="168" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="#000000"/>

    <!-- Graduation Cap (Floating Above) -->
    <g filter="url(#float-shadow)">
      <!-- Cap Skullcap Base -->
      <path d="M 172 102 C 172 95, 228 95, 228 102 L 224 114 C 210 119, 190 119, 176 114 Z" fill="#017a5c"/>
      
      <!-- Cap Rhombus Top -->
      <polygon points="200,82 255,97 200,112 145,97" fill="url(#primary-grad)"/>
      
      <!-- Cap Top Highlight -->
      <polygon points="200,82 255,97 200,100 145,97" fill="#18e3b0" opacity="0.3"/>

      <!-- Tassel Button -->
      <ellipse cx="200" cy="97" rx="3.5" ry="2" fill="#F59E0B"/>

      <!-- Tassel Ribbon -->
      <path d="M 200 97 C 220 100, 232 110, 234 122" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Tassel Fringe -->
      <polygon points="231,122 237,122 238,133 230,133" fill="#D97706"/>
    </g>

    <!-- Empty/Search Symbol Overlay (Magnifying Glass with Plus) -->
    <g transform="translate(230, 80)" filter="url(#float-shadow)">
      <!-- Glass Circle -->
      <circle cx="24" cy="24" r="20" fill="#FFFFFF" stroke="#00cc99" stroke-width="4"/>
      <!-- Plus Sign inside Glass (representing "Add Courses" / "Discover") -->
      <line x1="24" y1="16" x2="24" y2="32" stroke="#18e3b0" stroke-width="3.5" stroke-linecap="round" fill="#000000"/>
      <line x1="16" y1="24" x2="32" y2="24" stroke="#18e3b0" stroke-width="3.5" stroke-linecap="round" fill="#000000"/>
      <!-- Handle -->
      <path d="M 38 38 L 50 50" stroke="#04ad83" stroke-width="5" stroke-linecap="round" fill="#000000"/>
    </g>

  </g>
</svg>